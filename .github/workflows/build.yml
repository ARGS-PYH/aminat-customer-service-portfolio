name: Validate portfolio build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Vite app
        run: npm run build
      - name: Upload built preview
        uses: actions/upload-artifact@v4
        with:
          name: aminat-react-preview
          path: dist/
          retention-days: 3
